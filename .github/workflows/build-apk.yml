
name: Build 2030 Android APK

on:
  push:
    paths:
      - "2030-phase2-emailjs.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          test -f 2030-phase2-emailjs.zip || {
            echo "ZIP file not found in repository root"
            exit 1
          }

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q 2030-phase2-emailjs.zip -d extracted

          PROJECT_DIR=$(find extracted -name package.json \
            -not -path "*/node_modules/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extracted/**/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install

      - name: Build web project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build --if-present

      - name: Configure Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2030-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
